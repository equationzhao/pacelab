  <script>
(function(){
  'use strict';
  const Lab=window.Lab;
  const {uid,clamp}=Lab.core;
  const goals=[
    {id:'lt1',name:'重点确定 LT1',minIncrement:10,maxIncrement:15,incrementRatio:1/18,stageMinutes:7,stageCount:10},
    {id:'both',name:'同时估计 LT1、LT2',minIncrement:15,maxIncrement:25,incrementRatio:.075,stageMinutes:6,stageCount:10},
    {id:'overview',name:'快速获得总体曲线',minIncrement:25,maxIncrement:30,incrementRatio:.1,stageMinutes:4,stageCount:9}
  ];
  const definitions=[
    {id:'lactate-step',name:'乳酸阶梯测试',icon:'droplet'}
  ];
  function validAthlete(x){
    const a={name:String(x?.name||'').trim().slice(0,100),sex:String(x?.sex||''),age:Number(x?.age),ftp:Number(x?.ftp)};
    if(!a.name)throw Error('请填写姓名');
    if(!['male','female','undisclosed'].includes(a.sex))throw Error('请选择性别');
    if(!Number.isInteger(a.age)||a.age<1||a.age>120)throw Error('年龄应为 1–120 的整数');
    if(!Number.isInteger(a.ftp)||a.ftp<20||a.ftp>1200)throw Error('FTP 应为 20–1200 W 的整数');
    return a;
  }
  function readAthlete(x){try{return validAthlete(x)}catch{return null}}
  function generate(ftp,goalId){
    const power=Number(ftp),goal=goals.find(g=>g.id===goalId);
    if(!Number.isInteger(power)||power<20||power>1200)throw Error('FTP 应为 20–1200 W 的整数');
    if(!goal)throw Error('请选择测试目的');
    const nearest5=value=>Math.round(value/5)*5;
    return {startPower:clamp(nearest5(power*.45),20,600),increment:clamp(nearest5(power*goal.incrementRatio),goal.minIncrement,goal.maxIncrement),stageMinutes:goal.stageMinutes,stageCount:goal.stageCount};
  }
  function newSession(input){
    const stages=[];
    for(let i=0;i<input.stageCount;i++){
      stages.push({id:uid(),power:input.startPower+i*input.increment,durationSec:input.stageMinutes*60,lactate:null,hr:null,rpe:null,quality:'normal',notes:'',recordedAt:null});
    }
    const now=new Date().toISOString();
    return {id:uid(),type:'lactate-step',schemaVersion:1,name:input.name||'乳酸阶梯测试',createdAt:now,updatedAt:now,
      athlete:input.athlete?{...input.athlete}:null,
      protocol:{preset:input.preset||'custom',goal:input.goal||null,startPower:input.startPower,increment:input.increment,stageMinutes:input.stageMinutes,stageCount:input.stageCount,samplingMode:input.samplingMode,samplePauseSec:input.samplePauseSec||45,sampleSite:input.sampleSite||'earlobe',beep:!!input.beep},
      metadata:{notes:'',device:'',environment:'',operator:''},
      restingSample:null,
      stages,
      execution:{stageIndex:0,phase:'effort',status:'idle',elapsedMs:0,startedAt:null,finishedAt:null}
    };
  }
  function validInput(x){
    const v={startPower:Number(x.startPower),increment:Number(x.increment),stageMinutes:Number(x.stageMinutes),stageCount:Number(x.stageCount),samplePauseSec:Number(x.samplePauseSec||45),name:String(x.name||'').trim().slice(0,100),samplingMode:x.samplingMode==='solo'?'solo':'assisted',sampleSite:['earlobe','fingertip'].includes(x.sampleSite)?x.sampleSite:'earlobe',beep:!!x.beep,preset:String(x.preset||'custom')};
    v.goal=goals.some(g=>g.id===x.goal)?x.goal:null;
    v.athlete=x.athlete?validAthlete(x.athlete):null;
    if(!Number.isInteger(v.startPower)||v.startPower<20||v.startPower>600)throw Error('起始功率应为 20–600 W 的整数');
    if(!Number.isInteger(v.increment)||v.increment<5||v.increment>100)throw Error('功率步长应为 5–100 W 的整数');
    if(!Number.isInteger(v.stageMinutes)||v.stageMinutes<2||v.stageMinutes>15)throw Error('单级时间应为 2–15 分钟的整数');
    if(!Number.isInteger(v.stageCount)||v.stageCount<3||v.stageCount>25)throw Error('阶段数量应为 3–25');
    if(v.startPower+(v.stageCount-1)*v.increment>1200)throw Error('末级功率超出 1200 W，请调整协议');
    if(!Number.isInteger(v.samplePauseSec)||v.samplePauseSec<15||v.samplePauseSec>120)throw Error('采样预留应为 15–120 秒');
    return v;
  }
  Lab.tests={definitions,goals,generate,validAthlete,readAthlete,byId:(id)=>definitions.find(x=>x.id===id),newSession,validInput};
})();

  <script>
(function(){
 'use strict';
 const Lab=window.Lab;
 const METHOD='three-phase-turnpoints-v3';
 // Model selection and support rules, not physiological concentration cut-offs.
 const RESOLUTION=.1,FIRST_BIC_GAIN=2,JOINT_BIC_GAIN=2;
 function solve(matrix,vector){
  const rows=matrix.map((row,i)=>[...row,vector[i]]),n=vector.length;
  for(let c=0;c<n;c++){
   let pivot=c;
   for(let r=c+1;r<n;r++)if(Math.abs(rows[r][c])>Math.abs(rows[pivot][c]))pivot=r;
   if(Math.abs(rows[pivot][c])<1e-10)return null;
   [rows[c],rows[pivot]]=[rows[pivot],rows[c]];
   const divisor=rows[c][c];for(let j=c;j<=n;j++)rows[c][j]/=divisor;
   for(let r=0;r<n;r++)if(r!==c){const factor=rows[r][c];for(let j=c;j<=n;j++)rows[r][j]-=factor*rows[c][j]}
  }
  return rows.map(row=>row[n]);
 }
 function fit(points,knots){
  const columns=knots.length+2,normal=Array.from({length:columns},()=>Array(columns).fill(0)),rhs=Array(columns).fill(0);
  for(const p of points){
   const row=[1,p.x,...knots.map(k=>Math.max(0,p.x-k))];
   for(let i=0;i<columns;i++){rhs[i]+=row[i]*p.y;for(let j=0;j<columns;j++)normal[i][j]+=row[i]*row[j]}
  }
  const coefficients=solve(normal,rhs);if(!coefficients)return null;
  const predict=x=>coefficients[0]+coefficients[1]*x+knots.reduce((sum,k,i)=>sum+coefficients[i+2]*Math.max(0,x-k),0);
  const sse=points.reduce((sum,p)=>sum+(p.y-predict(p.x))**2,0);
  // Count fitted knot positions as parameters; the variance floor reflects input resolution.
  const bic=points.length*Math.log(Math.max(sse/points.length,RESOLUTION**2/12))+(2+2*knots.length)*Math.log(points.length);
  const slopes=[coefficients[1]];knots.forEach((k,i)=>slopes.push(slopes[i]+coefficients[i+2]));
  return {kind:knots.length?'segmented-linear':'linear',knots,coefficients,sse,bic,rmse:Math.sqrt(sse/points.length),slopes,predict};
 }

  if(!count)return fit(points,[]);
  const candidates=[];
  for(let i=0;i<points.length-1;i++)for(let quarter=0;quarter<4;quarter++){
   const x=points[i].x+(points[i+1].x-points[i].x)*quarter/4;
   const left=points.filter(p=>p.x<=x+1e-9).length;
   const right=points.filter(p=>shared?p.x>=x-1e-9:p.x>x+1e-9).length;
   if(left>=minPoints&&right>=minPoints)candidates.push({x,left});
  }

  for(let i=0;i<candidates.length;i++){
   if(count===1){consider([candidates[i].x]);continue}
   for(let j=i+1;j<candidates.length;j++){
    const middle=shared?points.filter(p=>p.x>=candidates[i].x-1e-9&&p.x<=candidates[j].x+1e-9).length:candidates[j].left-candidates[i].left;
    if(middle>=minPoints)consider([candidates[i].x,candidates[j].x]);
   }
  }

 }

  if(!model)return false;

  if(slopes[1]<=0||Math.abs(slopes[0])>slopes[1]*.25)return false;

 write(1,207,[[1,16,13,[0xb7,0xa4,0x2a,0xf1,0x3a,0x09,0x48,0x37,0x9a,0xb8,0x50,0x61,0x63,0x65,0x4c,0x62]],[3,1,U8,0],[4,4,U32,1]]);
 developerFields.forEach(([id,name,units,type])=>write(2,206,[[0,1,U8,0],[1,1,U8,id],[2,1,U8,type],[3,28,STR,name],[6,1,U8,1],[7,1,1,0],[8,12,STR,units]]));
 write(3,12,[[0,1,0,2],[1,1,0,6],[3,16,STR,'Indoor cycling']]);
 const messages=[],records=r.records.filter(x=>x.timestamp<=end).map(x=>({...x}));
 const laps=r.windows.filter(w=>w.startAt<=end);
 laps.forEach(w=>{
  const st=s.stages[w.index];if(st.lactate==null&&st.rpe==null)return;
  const at=R.readSampleTime(s,w.index,end),second=Math.floor(at/1000);
  let record=records.find(x=>x.stage===w.index&&Math.floor(x.timestamp/1000)===second);
  if(!record){record={timestamp:at,stage:w.index,phase:w.effortEndAt!==null&&at>=w.effortEndAt?'sampling':'effort',targetPower:st.power};records.push(record)}
  record.sample={lactate:st.lactate,rpe:st.rpe,time:fitTime(at),entered:Number.isFinite(Date.parse(st.recordedAt))?fitTime(Date.parse(st.recordedAt)):null,quality:['normal','suspect','exclude'].indexOf(st.quality)};
 });
 for(const span of r.spans){
  messages.push({at:span.startAt,priority:0,run:()=>write(4,21,[ts(span.startAt),[0,1,0,0],[1,1,0,0]])});
  const stop=Math.min(end,span.endAt??end);
  messages.push({at:stop,priority:3,run:()=>write(4,21,[ts(stop),[0,1,0,0],[1,1,0,4]])});
 }
 records.forEach(x=>messages.push({at:x.timestamp,priority:1,run:()=>write(5,20,[ts(x.timestamp),[3,1,U8,x.hr],[4,1,U8,x.cadence],[6,2,U16,x.speed==null?null:x.speed*1000],[7,2,U16,x.power]],
  [devField(0,x.sample?.lactate),devField(1,x.sample?.rpe),devField(2,x.stage+1),devField(3,x.targetPower),devField(4,x.phase==='sampling'?1:0),devField(5,x.sample?.time),devField(6,x.sample?.entered),devField(7,x.sample?.quality),...[['powerSource',10],['hrSource',11],['cadenceSource',12]].map(([key,id])=>devField(id,({power:1,heart:2,trainer:3})[x[key]]))])}));
 laps.forEach((w,i)=>{
  const stop=Math.min(end,w.endAt??end),st=s.stages[w.index],sampleTime=st.lactate!=null||st.rpe!=null?R.readSampleTime(s,w.index,end):null;
  messages.push({at:stop,priority:2,run:()=>write(6,19,[ts(stop),[254,2,U16,i],[0,1,0,9],[1,1,0,1],[2,4,U32,fitTime(w.startAt)],[7,4,U32,stop-w.startAt],[8,4,U32,R.measureTimer(r,w.startAt,stop)],[25,1,0,2],[39,1,0,6]],
   [devField(0,st.lactate),devField(1,st.rpe),devField(2,w.index+1),devField(3,st.power),devField(5,sampleTime===null?null:fitTime(sampleTime)),devField(6,Number.isFinite(Date.parse(st.recordedAt))?fitTime(Date.parse(st.recordedAt)):null),devField(7,['normal','suspect','exclude'].indexOf(st.quality))])});
 });
 messages.sort((a,b)=>a.at-b.at||a.priority-b.priority).forEach(message=>message.run());
 const timer=R.measureTimer(r,start,end),rest=s.restingSample;
 write(7,18,[ts(end),[254,2,U16,0],[0,1,0,8],[1,1,0,1],[2,4,U32,fitTime(start)],[5,1,0,2],[6,1,0,6],[7,4,U32,end-start],[8,4,U32,timer],[25,2,U16,0],[26,2,U16,laps.length]],
  [devField(8,rest?.skipped?null:rest?.lactate),devField(9,Number.isFinite(Date.parse(rest?.recordedAt))?fitTime(Date.parse(rest.recordedAt)):null)]);
 write(8,34,[ts(end),[0,4,U32,timer],[1,2,U16,1],[2,1,0,0],[3,1,0,26],[4,1,0,1]]);
 return writer.finishFile();
}
Lab.fit={encodeSession,computeCrc,fitTime,developerFields};
})();

</script>
  <script>
(function(){
'use strict';
const Lab=window.Lab;

const D=Lab.devices,R=Lab.recording;

let db=C.read();
let lastRecordingSave=0;

for(const session of db.sessions)if(R.recoverRecording(session))C.write(db);
let view='workbench',preset='lt1',goal='lt1',search='',compareIds=[];
const $=q=>document.querySelector(q);
const active=()=>db.sessions.find(s=>s.id===db.activeId)||null;
const statusLabels={idle:'尚未开始',running:'测试进行中',paused:'已暂停',ready:'等待下一阶段',done:'已完成'};

const tag=(st)=>`<span class="status-pill ${statusClass[st]||''}"><span class="status-dot"></span>${statusLabels[st]||'—'}</span>`;

const sexLabel=sex=>({male:'男',female:'女',undisclosed:'不透露'}[sex]||'');
function athleteText(a){return a?[a.name,sexLabel(a.sex),`${a.age} 岁`,`FTP ${a.ftp} W`].join(' · '):''}
function athleteLine(s){const parts=[athleteText(s.athlete),T.goals.find(g=>g.id===s.protocol.goal)?.name].filter(Boolean);return parts.length?`<div class="athlete-line">${parts.map(esc).join(' · ')}</div>`:''}
function persist(s=null){if(s)s.updatedAt=new Date().toISOString();C.write(db)}
function setView(v){view=v;$('#layout')?.classList.remove('show-menu');render()}
function toast(msg){const wrap=$('#toast-stack');const node=document.createElement('div');node.className='toast';node.textContent=msg;wrap.appendChild(node);setTimeout(()=>node.remove(),4200)}
Lab.ui={toast};
function renderSidebar(){
 const nav=[['workbench','测试工作台','activity'],['analysis','结果分析','chart'],['history','历史记录','history']];
 $('#sidebar').innerHTML=`<a class="brand" href="#" data-action="go-workbench"><div class="brand-mark">${icon('activity')}</div><div class="brand-name">PaceLab<span style="color:#c5ef87">.</span></div></a>
 ${nav.map(([v,label,ic])=>`<button class="nav-link ${view===v?'active':''}" data-action="view" data-view="${v}">${icon(ic)}<span>${label}</span>${v==='history'?`<span class="tiny-pill">${db.sessions.length}</span>`:''}</button>`).join('')}`;
}
function renderTopbar(){
 $('#topbar').innerHTML=`<div style="display:flex;align-items:center;gap:15px;min-width:0"><button class="btn btn-ghost btn-icon menu-button" aria-label="打开菜单" data-action="toggle-menu">${icon('menu')}</button><div class="breadcrumbs"><b>乳酸阶梯测试</b></div></div><div class="top-actions">${btn('import',icon('upload')+' 导入 JSON','btn btn-sm')}${btn('new',icon('plus')+' 新建测试','btn btn-sm btn-dark')}</div>`;
}
function heading(title,actions=''){
 return `<div class="heading"><h1>${esc(title)}</h1>${actions?`<div class="heading-actions">${actions}</div>`:''}</div>`;
}

function turnpointFoot(result,reason){return result?`定位区间 ${fmt(result.between[0])}–${fmt(result.between[1])} W`:(reason||'未识别')}
function turnpointMarkers(a){return [['LT1',a.lt1,'#9da64a'],['LT2',a.lt2,'#709bbd']].filter(([,result])=>result).map(([label,result,color])=>({x:result.power,label,color,between:result.between}))}
function metricCard(label,value,unit='',foot=''){return `<div class="card stat"><div class="stat-label">${esc(label)}</div><div class="stat-value">${value} <small>${esc(unit)}</small></div>${foot?`<div class="stat-foot">${esc(foot)}</div>`:''}</div>`}
function introStats(s,a){
 return `<div class="stats">${metricCard('有效乳酸样本',a.validCount,`/ ${s.stages.length} 级`)}${metricCard('LT1 拐点估计',a.lt1?fmt(a.lt1.power):'—','W',turnpointFoot(a.lt1,a.lt1Reason))}${metricCard('LT2 拐点估计',a.lt2?fmt(a.lt2.power):'—','W',turnpointFoot(a.lt2,a.lt2Reason))}${metricCard('最高有效乳酸',a.peak===null?'—':fmt(a.peak,1),'mmol/L')}</div>`;
}
function elapsedNow(e){return Math.max(0,(e.elapsedMs||0)+(e.status==='running'&&e.startedAt?Math.max(0,Date.now()-e.startedAt):0))}
function phaseDuration(s){return s.execution.phase==='sampling'?s.protocol.samplePauseSec*1000:s.stages[s.execution.stageIndex].durationSec*1000}
function shouldShowSampleEntry(s){const e=s.execution;return ['running','paused','ready'].includes(e.status)&&(e.phase==='sampling'||phaseDuration(s)-elapsedNow(e)<=30000)}
function renderSampleFields(s,index,prefix){const st=s.stages[index];return `<div class="sample-fields">${[['lactate','乳酸值','mmol/L','0.2','30','0.1'],['rpe','RPE','0–10','0','10','0.5']].map(([field,label,unit,min,max,step])=>`<div class="sample-field"><label for="${prefix}-${field}">${label}<span>${unit}</span></label><input id="${prefix}-${field}" aria-label="第${index+1}级${label}" aria-describedby="${prefix}-${field}-error" data-index="${index}" data-field="${field}" type="number" inputmode="decimal" min="${min}" max="${max}" step="${step}" placeholder="—" value="${esc(st[field]??'')}"><span class="sample-error" id="${prefix}-${field}-error" aria-live="polite"></span></div>`).join('')}</div>`}
function renderSampleEntry(s){const index=s.execution.stageIndex;return `<div class="sample-entry" data-stage="${index}"><div class="sample-heading"><span class="sample-symbol">${icon('droplet')}</span><div><h2>准备采血 · 第 ${index+1} 级</h2><p>${s.stages[index].power} W · 记录本级乳酸值与 RPE</p></div></div>${renderSampleFields(s,index,'live-sample')}<p class="sample-note">输入后自动保存，计时结束${index===s.stages.length-1?'自动结束测试':'自动进入下一阶段'}。未填数据可稍后补录。</p></div>`}
function describeRestingSample(s){const sample=s.restingSample;return sample?.skipped?'已跳过':A.value(sample?.lactate)===null?'未记录':`${fmt(sample.lactate,1)} mmol/L`}
function renderRestingSummary(s){return `<div class="resting-summary">${icon('droplet')}<span>静息乳酸 <strong>${describeRestingSample(s)}</strong></span></div>`}
function renderRestingEntry(s){return `<div class="sample-entry resting-entry"><div class="sample-heading"><span class="sample-symbol">${icon('droplet')}</span><div><h2>静息乳酸测试</h2><p>开始第一级前，记录静息状态下的乳酸值</p></div></div><div class="sample-field"><label for="resting-lactate">静息乳酸值<span>mmol/L</span></label><input id="resting-lactate" type="number" inputmode="decimal" min="0.2" max="30" step="0.1" placeholder="—" aria-describedby="resting-lactate-error" value="${esc(s.restingSample?.lactate??'')}"><span class="sample-error" id="resting-lactate-error" aria-live="polite"></span></div><p class="sample-note">输入后自动保存。准备好后开始第一级，也可以直接跳过。</p></div>`}
function renderLive(s){
 const e=s.execution,st=s.stages[Math.min(e.stageIndex,s.stages.length-1)];
 const next=s.stages.slice(e.stageIndex,e.stageIndex+5);
 return `<div class="card card-pad"><div class="session-line"><span class="session-title">${esc(s.name)}</span>${tag(e.status)}<span>${dateText(s.createdAt)}</span></div>${athleteLine(s)}${e.status!=='idle'?renderRestingSummary(s):''}
  <div class="live-card"><div class="live-top"><span class="live-label">阶段计时</span><span class="live-mode">${s.protocol.samplingMode==='solo'?'单人 · 分段采样':'双人 · 连续采样'}</span></div>
   ${e.status==='idle'?renderRestingEntry(s):`<div class="live-center"><div><div class="live-step" id="live-step">阶段 ${String(e.stageIndex+1).padStart(2,'0')} / ${String(s.stages.length).padStart(2,'0')}</div><div class="live-power" id="live-power">${st.power}<small>W</small></div></div><div class="timer-area"><label id="live-phase-label">${e.phase==='sampling'?'采样间隔':'当前阶段剩余'}</label><div id="live-time" class="timer">${fmtTime(st.durationSec*1000)}</div><div class="timer-label" id="live-total">目标 ${st.durationSec/60} 分钟 / 级</div></div></div>
   <div class="live-sensors">${[['power','实际功率','W'],['hr','心率','bpm'],['cadence','踏频','rpm']].map(([key,label,unit])=>`<div><span>${label}</span><strong data-live-sensor="${key}">—</strong><small>${unit}</small></div>`).join('')}</div><div class="erg-status" data-erg-status aria-live="polite"></div>
   <div class="stage-progress"><div id="live-progress" class="stage-fill"></div></div><div id="live-hint" class="live-hint" hidden></div>
   <div id="live-sample-entry">${shouldShowSampleEntry(s)?renderSampleEntry(s):''}</div>`}
   <div class="live-buttons" id="live-controls">${liveControls(s)}</div>
  </div>
  <div class="card-heading" style="margin-top:24px;margin-bottom:8px"><div><div class="card-title" style="font-size:13px">阶段功率</div></div></div><div class="next-steps">${next.map((x,i)=>`<div class="power-chip ${i===0?'active':''}">${x.power} W <span style="color:#9aa5a8;font-size:10px">· ${Math.round(x.durationSec/60)}′</span></div>`).join('')}</div>
 </div>`;
}
function liveControls(s){const e=s.execution;
 if(e.status==='done')return btn('duplicate',icon('copy')+' 复制此测试','btn btn-primary')+btn('view-analysis',icon('chart')+' 查看结果','btn btn-dark');
 if(e.status==='idle')return btn('start',icon('play')+' 保存并开始','btn btn-primary')+btn('skip-resting','跳过并开始 '+icon('arrow'),'btn btn-dark');
 if(e.status==='ready')return btn('next',icon('arrow')+' '+(e.stageIndex<s.stages.length-1?'下一阶段':'结束测试'),'btn btn-primary')+btn('finish',icon('stop')+' 结束','btn btn-dark');
 return (e.status==='running'?btn('pause',icon('pause')+' 暂停','btn btn-primary'):btn('start',icon('play')+' 继续','btn btn-primary'))+btn('next',icon('arrow')+' 下一阶段','btn btn-dark')+btn('finish',icon('stop')+' 结束','btn btn-dark');
}
function fmtTime(ms){const secs=Math.ceil(Math.max(0,ms)/1000);const mm=Math.floor(secs/60),ss=secs%60;return `${String(mm).padStart(2,'0')}:${String(ss).padStart(2,'0')}`}
function sessionRows(s){
 const e=s.execution;
 return s.stages.map((st,i)=>{
 const lac=A.value(st.lactate);
 return `<tr class="${i===e.stageIndex&&e.status!=='done'?'active-row':''}"><td><span class="table-index">${String(i+1).padStart(2,'0')}</span></td><td><strong>${st.power}</strong> W</td><td>${fmt(st.durationSec/60)} min</td>
 <td>${lac===null?'—':fmt(lac,1)}</td><td>${esc(st.hr??'—')}</td><td>${esc(st.rpe??'—')}</td>
 <td>${st.quality==='exclude'?'排除':st.quality==='suspect'?'可疑':'正常'}</td><td>${esc(st.notes||'—')}</td>
 <td>${btn('edit-sample',lac===null||A.value(st.rpe)===null?'补录':'修改','btn btn-sm',`data-index="${i}" aria-label="录入第${i+1}级数据"`)}</td></tr>`;
 }).join('');
}
function recordTable(s){
 return `<div class="card card-pad section-space"><div class="details"><div><div class="card-title">阶段记录</div></div><div class="details-tools">${btn('export-csv',icon('download')+' CSV','btn btn-sm')}${btn('export-json',icon('file')+' JSON','btn btn-sm')}</div></div>
  <div class="data-table-wrap"><table class="data-table"><thead><tr><th>级</th><th>目标功率</th><th>时长</th><th>乳酸 mmol/L</th><th>心率 bpm</th><th>RPE</th><th>样本质量</th><th>备注</th><th>记录</th></tr></thead><tbody id="record-rows">${sessionRows(s)}</tbody></table></div>
 </div>`;
}
function renderDevices(s){
 const reason=D.describeSupport();
 return `<div class="card card-pad section-space device-panel"><div class="details"><div><div class="card-title">设备与活动记录</div><p class="card-sub">连接蓝牙设备后，开始测试即按秒记录实际读数</p></div>${btn('export-fit',icon('download')+' 导出 FIT','btn btn-sm',s.recording?'':'disabled')}</div><div class="device-grid">${Object.entries(D.specs).map(([kind,spec])=>`<div class="device-slot"><span>${esc(spec.label)}</span><strong id="device-${kind}-name"></strong><small id="device-${kind}-status"></small><button class="btn btn-sm" data-action="connect-device" data-kind="${kind}" id="device-${kind}-button" ${reason?'disabled':''}>连接</button></div>`).join('')}</div><div class="erg-status" data-erg-status aria-live="polite"></div><div class="sensor-values">${[['power','实际功率','W'],['hr','实时心率','bpm'],['cadence','踏频','rpm']].map(([key,label,unit])=>`<div><span>${label}</span><strong id="sensor-${key}">—</strong><small>${unit}</small></div>`).join('')}</div><div class="recording-note" id="recording-note"></div><p class="device-help">${esc(reason||'功率计使用 Cycling Power，心率带使用 Heart Rate；ERG 骑行台需支持 FTMS 目标功率控制。运动阶段自动设定瓦数，采血间隔与暂停时暂停骑行台，结束时停止。优先记录独立功率计与心率带。')} 请保持页面在前台；设备超过 5 秒未更新时留空记录。关闭页面后请在设备端确认负载已停止。</p></div>`;
}
function paintDevices(){
 if(!$('#recording-note'))return;
 for(const [kind,slot] of Object.entries(D.slots)){
  $(`#device-${kind}-name`).textContent=slot.name||'尚未选择设备';
  $(`#device-${kind}-status`).textContent=slot.status==='connected'?'已连接':slot.status==='connecting'?'正在连接…':'未连接';
  const button=$(`#device-${kind}-button`);button.textContent=slot.status==='connected'?'断开':slot.status==='connecting'?'连接中…':slot.name?'重新连接':'连接';button.disabled=slot.status==='connecting'||!!D.describeSupport();button.dataset.action=slot.status==='connected'?'disconnect-device':'connect-device';
 }
 const values=D.readSnapshot();for(const key of ['power','hr','cadence']){const text=values[key]===null?'—':fmt(values[key]);$(`#sensor-${key}`).textContent=text;const live=$(`[data-live-sensor="${key}"]`);if(live)live.textContent=text}
 const s=active(),r=s?.recording;
 $('#recording-note').textContent=r?`${s.execution.status==='running'?'● 正在记录':s.execution.status==='done'?'记录已结束':'记录已暂停'} · ${r.records.length.toLocaleString()} 条 · 乳酸与 RPE 随对应阶段写入 FIT`:'开始测试后自动记录，暂停时停止记录。乳酸与 RPE 可补录后重新导出。';
 const trainer=D.slots.trainer,erg=trainer.erg?.state;
 const message=erg?.error||trainer.error||(trainer.status==='connecting'?'正在连接 ERG 骑行台并获取控制权…':erg?.phase==='running'?`ERG 已确认目标 ${erg.power} W`:erg?.phase==='setting'?erg.desiredPower===null?'ERG 正在暂停 / 停止…':`ERG 正在设置 ${erg.desiredPower} W…`:erg?.phase==='paused'?'ERG 已暂停 · 下一运动阶段自动恢复':erg?.phase==='stopped'?'ERG 已停止':erg?.phase==='ready'?`ERG 已就绪 · ${erg.range.min}–${erg.range.max} W，步长 ${erg.range.step} W`:'ERG 未连接 · 可手动控制功率进行测试');
 document.querySelectorAll('[data-erg-status]').forEach(node=>{if(node.textContent!==message)node.textContent=message;node.classList.toggle('has-error',!!(erg?.error||trainer.error))});
}
function validateErgProtocol(s){
 const trainer=D.slots.trainer;if(trainer.status!=='connected'||!trainer.erg)return;
 if(trainer.erg.state.requiresReconnect)throw Error('ERG 控制响应超时，请在设备端停止负载后断开并重新连接');
 s.stages.slice(s.execution.stageIndex).forEach(stage=>Lab.erg.validatePower(trainer.erg.state.range,stage.power));
}
function syncErgControl(retry=false){
 const trainer=D.slots.trainer,s=active();if(trainer.status!=='connected'||!trainer.erg){if(s?.execution.status==='running')controlledSessionId=null;return}
 try{
  if(s?.execution.status==='running'){
   validateErgProtocol(s);controlledSessionId=s.id;
   trainer.erg.setDesired(s.execution.phase==='sampling'?'paused':'running',s.execution.phase==='sampling'?null:s.stages[s.execution.stageIndex].power,retry&&!!trainer.erg.state.error);
  }else if(controlledSessionId)trainer.erg.setDesired(!s||s.id!==controlledSessionId||s.execution.status==='done'?'stopped':'paused');
 }catch(error){if(s?.execution.status==='running')pause();toast(error.message)}
}
function handleDeviceChange(){
 const trainer=D.slots.trainer,s=active();
 const newlyConnected=trainer.status==='connected'&&lastTrainerStatus!=='connected';lastTrainerStatus=trainer.status;
 if(s?.execution.status==='running'&&controlledSessionId===s.id&&(trainer.status==='disconnected'||trainer.erg?.state.error)){
  const reason=trainer.erg?.state.error||trainer.error||'ERG 骑行台连接已断开，请在设备端确认负载已停止';
  pause();toast(reason+'；测试已暂停');
 }else if(newlyConnected)syncErgControl();
 if(trainer.status==='disconnected')controlledSessionId=null;
 paintDevices();
}
function captureActivity(now=Date.now()){
 const s=active();if(!s||s.execution.status!=='running')return;
 if(!s.recording)R.beginRecording(s,now);
 R.captureRecord(s,D.readSnapshot(now),now);
 if(now-lastRecordingSave>=5000){persist(s);lastRecordingSave=now}
 paintDevices();

function start(skipResting=false){const s=active();if(!s)return;let e=s.execution;

 try{validateErgProtocol(s)}catch(error){toast(error.message);return}
 if(e.status==='idle'){
  if(skipResting)s.restingSample={lactate:null,recordedAt:null,skipped:true};
  else{const input=$('#resting-lactate');if(!input||!saveRestingSample(input,true))return}
  e.stageIndex=0;e.phase='effort';e.elapsedMs=0;
 }
 e.status='running';e.startedAt=Date.now();R.beginRecording(s,e.startedAt);syncErgControl(true);captureActivity(e.startedAt);persist(s);render();if(s.protocol.beep)beep();}
function saveRestingSample(input,required=false){const s=active();if(!s||s.execution.status!=='idle')return false;
 input.setCustomValidity('');
 if(required&&input.value===''&&!input.validity.badInput)input.setCustomValidity('请填写静息乳酸值，或选择跳过并开始');
 else if(!input.validity.valid)input.setCustomValidity('请输入 0.2–30 之间的数值，保留一位小数');
 showSampleError(input);
 if(!input.validity.valid){if(required){input.reportValidity();input.focus()}return false}
 s.restingSample=input.value===''?null:{lactate:Number(input.value),recordedAt:new Date().toISOString(),skipped:false};persist(s);return true;
}
function pause(){const s=active();if(!s)return;const e=s.execution;if(e.status!=='running')return;captureActivity();e.elapsedMs=elapsedNow(e);e.startedAt=null;e.status='paused';R.stopRecording(s);syncErgControl();persist(s);render()}
function finish(){const s=active();if(!s)return;if(s.execution.status==='done')return;
 if(s.execution.status!=='idle'&&!window.confirm('结束测试？结束后无法继续计时。'))return;
 captureActivity();const e=s.execution;e.status='done';e.finishedAt=new Date().toISOString();e.elapsedMs=0;e.startedAt=null;R.stopRecording(s,Date.now(),true);syncErgControl();persist(s);render()}
function nextStage(){const s=active();if(!s)return;const e=s.execution;
 if(e.stageIndex>=s.stages.length-1){captureActivity();e.status='done';e.finishedAt=new Date().toISOString();e.startedAt=null;e.elapsedMs=0;R.stopRecording(s,Date.now(),true);syncErgControl();persist(s);render();return}
 e.stageIndex++;e.phase='effort';e.elapsedMs=0;e.startedAt=Date.now();e.status='running';R.beginRecording(s,e.startedAt);R.syncStage(s,e.startedAt);syncErgControl();captureActivity();persist(s);render();if(s.protocol.beep)beep();}
function beep(){try{const AudioCtx=window.AudioContext||window.webkitAudioContext;if(!AudioCtx)return;const ctx=new AudioCtx();const o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=784;g.gain.setValueAtTime(.0001,ctx.currentTime);g.gain.exponentialRampToValueAtTime(.12,ctx.currentTime+.02);g.gain.exponentialRampToValueAtTime(.0001,ctx.currentTime+.23);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.25);setTimeout(()=>ctx.close(),600)}catch{}}
function updateExecution(){const s=active();if(!s||s.execution.status!=='running')return;
 const e=s.execution;let transitions=0;
 while(e.status==='running'&&elapsedNow(e)>=phaseDuration(s)&&transitions<s.stages.length*2){
  transitions++;
  const stageIndex=e.stageIndex,duration=phaseDuration(s);
  const phaseOverrun=elapsedNow(e)-duration;
  if(e.phase==='effort'&&s.protocol.samplingMode==='solo'){
    e.phase='sampling';e.elapsedMs=Math.max(0,phaseOverrun);e.startedAt=Date.now();if(s.protocol.beep)beep();
  }else if(e.stageIndex<s.stages.length-1){
    e.stageIndex++;e.phase='effort';e.elapsedMs=Math.max(0,phaseOverrun);e.startedAt=Date.now();if(s.protocol.beep)beep();
  }else{
    e.status='done';e.startedAt=null;e.finishedAt=new Date().toISOString();e.elapsedMs=duration;
  }
  const boundary=Date.now()-phaseOverrun;
  if(e.status==='done'){e.finishedAt=new Date(boundary).toISOString();R.stopRecording(s,boundary,true)}else R.syncStage(s,boundary);
  persist(s);if(e.stageIndex!==stageIndex||e.status==='done')render();else paintLive();
 }
 syncErgControl();
}
function paintLive(){const s=active(),timer=$('#live-time');if(!s||!timer||view!=='workbench')return;
 const e=s.execution,st=s.stages[e.stageIndex];if(!st)return;
 const elapsed=Math.min(phaseDuration(s),elapsedNow(e));const remain=phaseDuration(s)-elapsed;
 timer.textContent=fmtTime(e.status==='idle'?phaseDuration(s):e.status==='done'?0:remain);
 const progress=$('#live-progress');if(progress)progress.style.width=(e.status==='done'?100:Math.min(100,Math.max(0,elapsed/phaseDuration(s)*100)))+'%';
 const title=$('#live-phase-label');if(title)title.textContent=e.phase==='sampling'?'采样间隔剩余':'当前阶段剩余';
 const afterSampling=e.stageIndex===s.stages.length-1?'结束测试':'进入下一阶段';
 const total=$('#live-total');if(total)total.textContent=e.status==='done'?'测试已完成':e.phase==='sampling'?`采样计时结束后自动${afterSampling}`:`目标 ${st.durationSec/60} 分钟 / 级`;
 const hint=$('#live-hint');if(hint){
  const message=e.status==='ready'?'采样已结束，点击下一阶段继续':e.status!=='running'?'':e.phase==='sampling'?`正在采样 · 间隔结束后自动${afterSampling}`:remain<=30000?'准备采血 · 请记录本级数据':remain<=60000?'阶段剩余不足 1 分钟':'';
  hint.hidden=!message;
  hint.textContent=message;
 }
 const entry=$('#live-sample-entry');if(entry){
  const visible=shouldShowSampleEntry(s);
  if(visible&&!entry.firstElementChild)entry.innerHTML=renderSampleEntry(s);
  else if(!visible&&entry.firstElementChild)entry.innerHTML='';
 }
}
function checkSampleField(target){const s=active();if(!s)return;const index=Number(target.dataset.index),field=target.dataset.field;
 if(!Number.isInteger(index)||index<0||index>=s.stages.length||!['lactate','hr','rpe','notes','quality'].includes(field))return;
 const stage=s.stages[index];const raw=target.value;
 if(['lactate','hr','rpe'].includes(field)){
   let nv=raw===''?null:Number(raw);
   const bounds={lactate:[.2,30],hr:[30,240],rpe:[0,10]}[field];
   target.setCustomValidity('');
   if(target.validity.badInput||target.validity.stepMismatch||(nv!==null&&(!Number.isFinite(nv)||nv<bounds[0]||nv>bounds[1]))){target.setCustomValidity(`请输入 ${bounds[0]}–${bounds[1]} 之间的数值${field==='rpe'?'，以 0.5 递增':field==='lactate'?'，保留一位小数':''}`);showSampleError(target);return}
   showSampleError(target);stage[field]=nv;
   if(['lactate','rpe'].includes(field)&&nv!==null){if(!stage.recordedAt)stage.recordedAt=new Date().toISOString();if(!stage.sampleAt&&s.execution.stageIndex===index&&['running','paused'].includes(s.execution.status))stage.sampleAt=Date.now()}
 }else if(field==='notes')stage.notes=raw.slice(0,200);
 else stage.quality=['normal','suspect','exclude'].includes(raw)?raw:'normal';
 persist(s);
 document.querySelectorAll(`[data-index="${index}"][data-field="${field}"]`).forEach(peer=>{if(peer!==target){peer.value=raw;peer.setCustomValidity('');showSampleError(peer)}});
 refreshDataDisplay(target);
}
function showSampleError(target){target.setAttribute('aria-invalid',String(!!target.validationMessage));const error=document.getElementById(target.id+'-error');if(error)error.textContent=target.validationMessage}
function duplicate(source){const s=source||active();if(!s)return;pauseActive();
 const input=T.validInput({...s.protocol,athlete:s.athlete,name:s.name+'（副本）'});
 const copy=T.newSession(input);copy.metadata={...s.metadata,notes:''};db.sessions.push(copy);db.activeId=copy.id;view='workbench';persist();render()}
function exportedSession(s){const a=A.analyze(s.stages),copy={...s,execution:{...s.execution}};
 if(s.execution.status==='running'){
  copy.execution={...s.execution,status:'paused',elapsedMs:elapsedNow(s.execution),startedAt:null};
  if(s.recording){copy.recording={...s.recording,spans:s.recording.spans.map(span=>({...span}))};R.stopRecording(copy)}
 }
 return {...copy,analysis:{method:a.method,model:a.model,lt1Model:a.lt1Model,lt2Model:a.lt2Model,lt2Region:a.lt2Region,lt1:a.lt1,lt2:a.lt2,reason:a.reason,lt1Reason:a.lt1Reason,lt2Reason:a.lt2Reason}}}
function downloadJson(s){if(!s)return toast('请先创建测试');C.download(JSON.stringify({schemaVersion:1,exportType:'session',exportedAt:new Date().toISOString(),session:exportedSession(s)},null,2),`PaceLab_${safeFile(s.name)}.json`,'application/json;charset=utf-8')}
function downloadFit(s){if(!s)return;try{C.download(Lab.fit.encodeSession(s),`PaceLab_${safeFile(s.name)}.fit`,'application/octet-stream')}catch(error){toast(error.message)}}
function safeFile(s){return String(s).replace(/[\\/:*?"<>|\n\r]/g,'_').slice(0,70)||'测试'}
function importSessions(data){
 const raw=data?.exportType==='backup'?data.sessions:data?.exportType==='session'?[data.session]:null;
 if(data?.schemaVersion!==1||!Array.isArray(raw))throw Error('无法识别的文件格式或数据版本');
 if(raw.length>300)throw Error('一次导入的测试数量过多（上限 300）');
 const additions=[];
 for(const old of raw){
  if(old?.type!=='lactate-step'||!Array.isArray(old.stages)||old.stages.length<3||old.stages.length>25)continue;
  let v;try{v=T.validInput({...old.protocol,athlete:T.readAthlete(old.athlete),stageCount:old.stages.length,name:String(old.name||'导入测试'),samplingMode:old.protocol?.samplingMode||'assisted'})}catch{continue}
  const s=T.newSession(v);s.id=uid();s.createdAt=Number.isFinite(Date.parse(old.createdAt))?old.createdAt:new Date().toISOString();
  s.name=v.name+([...db.sessions,...additions].some(x=>x.name===v.name)?'（导入）':'');
  s.metadata={notes:String(old.metadata?.notes||'').slice(0,1500),device:String(old.metadata?.device||'').slice(0,120),environment:String(old.metadata?.environment||'').slice(0,120),operator:String(old.metadata?.operator||'').slice(0,120)};
  const resting=old.restingSample,lactate=A.value(resting?.lactate);
  if(resting?.skipped===true)s.restingSample={lactate:null,recordedAt:null,skipped:true};
  else if(lactate!==null&&lactate>=.2&&lactate<=30)s.restingSample={lactate,recordedAt:Number.isFinite(Date.parse(resting.recordedAt))?resting.recordedAt:null,skipped:false};
  s.stages.forEach((stage,i)=>{const original=old.stages[i]||{};
    const pow=Number(original.power);if(Number.isFinite(pow)&&pow>=20&&pow<=1200)stage.power=pow;
    for(const [key,min,max] of [['lactate',.2,30],['hr',30,240],['rpe',0,10]]){const z=original[key];const x=Number(z);stage[key]=z===null||z===''||z===undefined||!Number.isFinite(x)||x<min||x>max?null:x}
    stage.quality=['normal','suspect','exclude'].includes(original.quality)?original.quality:'normal';
    stage.notes=String(original.notes||'').slice(0,200);stage.recordedAt=Number.isFinite(Date.parse(original.recordedAt||original.sampleAt))?(original.recordedAt||original.sampleAt):null;
    stage.sampleAt=Number.isFinite(original.sampleAt)?original.sampleAt:null;
  });
  const e=old.execution||{};
  s.execution={stageIndex:C.clamp(Math.trunc(Number(e.stageIndex)||0),0,s.stages.length-1),phase:e.phase==='sampling'?'sampling':'effort',status:e.status==='done'?'done':e.status==='idle'?'idle':'paused',elapsedMs:C.clamp(Number(e.elapsedMs)||0,0,10000000),startedAt:null,finishedAt:e.finishedAt||null};
  s.recording=R.readRecording(old.recording,s.stages.length);
  additions.push(s);
 }
 if(!additions.length)throw Error('文件中没有可以导入的乳酸阶梯测试');
 pauseActive();db.sessions.push(...additions);db.activeId=additions.at(-1).id;persist();view='history';render();
}
function printReport(s){if(!s)return;const a=A.analyze(s.stages);const printCell=(v)=>`<td>${esc(v??'—')}</td>`;
 $('#print-report').innerHTML=`<h1>PaceLab 测试报告</h1><p>乳酸阶梯测试 · ${dateText(new Date().toISOString())}</p><hr style="border:0;border-top:1px solid #ddd;margin:15px 0">
 <h2>${esc(s.name)}</h2>${athleteLine(s)}<p>创建时间：${dateText(s.createdAt)}　|　协议：${s.protocol.startPower} W 起步 / +${s.protocol.increment} W / ${s.protocol.stageMinutes} 分钟 × ${s.stages.length} 级<br>采样方式：${s.protocol.samplingMode==='solo'?'单人间断采样':'协助连续采样'}　|　部位：${s.protocol.sampleSite==='earlobe'?'耳垂':'指尖'}<br>设备：${esc(s.metadata?.device||'未填写')}　|　环境：${esc(s.metadata?.environment||'未填写')}</p>
 <p>静息乳酸：${describeRestingSample(s)}</p><div class="print-grid">${[['有效样本',String(a.validCount)+' / '+s.stages.length],['LT1 拐点估计',a.lt1?fmt(a.lt1.power)+' W':'—'],['LT2 拐点估计',a.lt2?fmt(a.lt2.power)+' W':'—'],['最高有效乳酸',a.peak!==null?fmt(a.peak,1)+' mmol/L':'—']].map(([l,v])=>`<div class="print-box"><span>${esc(l)}</span><strong>${esc(v)}</strong></div>`).join('')}</div>
 <h2>乳酸-功率曲线</h2>${Charts.curve(s.stages,'lactate',turnpointMarkers(a),a.fit,a.lt2Fit)}
 <h2>阶段记录明细</h2><table class="data-table"><thead><tr><th>阶段</th><th>功率</th><th>时长</th><th>乳酸</th><th>心率</th><th>RPE</th><th>质量</th><th>备注</th></tr></thead><tbody>${s.stages.map((st,i)=>`<tr>${printCell(i+1)}${printCell(st.power+' W')}${printCell(st.durationSec/60+' min')}${printCell(st.lactate)}${printCell(st.hr)}${printCell(st.rpe)}${printCell(st.quality==='normal'?'正常':st.quality==='exclude'?'排除':'可疑')}${printCell(st.notes)}</tr>`).join('')}</tbody></table>
 <p>方法：拐点模型比较（${esc(a.method)}；${esc(a.model||'未选定模型')}）。LT1：${esc(turnpointFoot(a.lt1,a.lt1Reason))}；LT2：${esc(turnpointFoot(a.lt2,a.lt2Reason))}。拐点为模型估计，定位区间不是置信区间。</p><p>测试备注：${esc(s.metadata?.notes||'无')}<br>数据质量：${(a.flags.length?a.flags:[{kind:'neutral',text:'无异常记录'}]).map(f=>esc(f.text)).join('；')||'无'}</p>`;
 window.print();
}
function createFromForm(){
 const form=$('#new-form');if(!form)return;
 if($('#protocol-step').hidden){protocolStep();return}
 if(!form.reportValidity())return;
 const get=name=>form.querySelector(`[name="${name}"]`)?.value;
 try{
  const v=T.validInput({name:get('name'),startPower:get('startPower'),increment:get('increment'),stageMinutes:get('stageMinutes'),stageCount:get('stageCount'),samplingMode:get('samplingMode'),sampleSite:get('sampleSite'),samplePauseSec:get('samplePauseSec'),beep:form.querySelector('[name="beep"]').checked,preset,goal,athlete:formAthlete()});
  pauseActive();const s=T.newSession(v);db.sessions.push(s);db.activeId=s.id;db.athlete={...v.athlete};view='workbench';persist();closeModal();render();
 }catch(err){const target=$('#new-error');if(target)target.textContent=err.message;else toast(err.message)}
}
function saveEdit(){const s=active();if(!s)return;
 s.name=$('#edit-name').value.trim().slice(0,100)||s.name;
 s.metadata={device:$('#edit-device').value.slice(0,120),environment:$('#edit-environment').value.slice(0,120),operator:$('#edit-operator').value.slice(0,120),notes:$('#edit-notes').value.slice(0,1500)};
 persist(s);closeModal();render()
}
function handleClick(event){
 const overlay=event.target.closest('[data-dismiss="modal"]');if(overlay&&event.target===overlay){closeModal();return}
 const el=event.target.closest('[data-action]');if(!el)return;
 event.preventDefault();
 const action=el.dataset.action;
 const getSession=()=>db.sessions.find(s=>s.id===el.dataset.id)||active();
 switch(action){
  case 'toggle-menu':$('#layout').classList.toggle('show-menu');break;
  case 'view':setView(el.dataset.view);break;
  case 'go-workbench':setView('workbench');break;
  case 'new':newModal();break;
  case 'close-modal':closeModal();break;
  case 'next-protocol':protocolStep();break;
  case 'back-profile':profileStep();break;
  case 'goal':selectGoal(el.dataset.goal);break;
  case 'create-test':createFromForm();break;
  case 'edit':editModal();break;
  case 'save-edit':saveEdit();break;
  case 'edit-sample':openSampleModal(Number(el.dataset.index));break;
  case 'connect-device':D.connectDevice(el.dataset.kind).then(paintDevices).catch(error=>toast(error.message));break;
  case 'disconnect-device':if(el.dataset.kind==='trainer')pauseActive();D.disconnectDevice(el.dataset.kind).catch(error=>toast(error.message));break;
  case 'start':start();break;
  case 'skip-resting':start(true);break;
  case 'pause':pause();break;
  case 'next':nextStage();break;
  case 'finish':finish();break;
  case 'duplicate':duplicate(getSession());break;
  case 'open-session':{const s=getSession();if(!s)return;if(s.id!==db.activeId)pauseActive();db.activeId=s.id;view='workbench';persist();render();break;}
  case 'view-analysis':setView('analysis');break;
  case 'export-csv':{const s=getSession();if(s){C.download(C.sessionCsv(s),`PaceLab_${safeFile(s.name)}.csv`,'text/csv;charset=utf-8')}break;}
  case 'export-json':downloadJson(getSession());break;
  case 'export-fit':downloadFit(getSession());break;
  case 'import':$('#import-file').click();break;
  case 'print':printReport(getSession());break;
  case 'delete':{
   const s=getSession();if(!s)return;
   if(!window.confirm(`删除「${s.name}」？此操作无法撤销。`))return;
   if(db.activeId===s.id)pauseActive();
   db.sessions=db.sessions.filter(x=>x.id!==s.id);
   if(db.activeId===s.id)db.activeId=db.sessions[db.sessions.length-1]?.id||null;
   compareIds=compareIds.filter(id=>id!==s.id);persist();render();break;
  }
 }
}
function handleInput(event){
 const target=event.target;
 if(target.id==='resting-lactate'){saveRestingSample(target);return}
 if(target.dataset?.field){checkSampleField(target);return}
 if(target.id==='history-search'){search=target.value;const box=$('#history-list');if(box)box.innerHTML=renderHistoryItems(db.sessions.filter(s=>s.name.toLowerCase().includes(search.toLowerCase())||s.type.includes(search.toLowerCase())));return}
 if(target.closest('#new-form')&&['startPower','increment','stageMinutes','stageCount'].includes(target.name)){preset='custom';updateNewSummary()}
}
function refreshDataDisplay(changed){
 const s=active();if(!s||view!=='workbench')return;
 const a=A.analyze(s.stages),stats=document.querySelector('.stats');
 if(stats)stats.outerHTML=introStats(s,a);
 const plot=$('#overview-lactate-chart');
 if(plot)plot.innerHTML=Charts.curve(s.stages,'lactate',turnpointMarkers(a),a.fit,a.lt2Fit);
 const rows=$('#record-rows');if(rows)rows.innerHTML=sessionRows(s);
 if(changed?.dataset?.field==='lactate')changed.classList.toggle('filled',A.value(changed.value)!==null);
}
function handleChange(event){
 const target=event.target;
 if(target.name==='samplingMode'&&target.closest('#new-form')){const solo=target.value==='solo';$('#sample-pause-group').hidden=!solo;$('#sample-pause').disabled=!solo;return}
 if(target.dataset?.field){if(target.validationMessage){toast(target.validationMessage);return}refreshDataDisplay(target);return}
 if(target.dataset?.compareId){
  const id=target.dataset.compareId;
  if(target.checked){if(compareIds.length>=3){target.checked=false;toast('最多对比 3 次测试');return}compareIds.push(id)}else compareIds=compareIds.filter(x=>x!==id);
  render();return;
 }
}
async function handleImport(event){const file=event.target.files?.[0];event.target.value='';if(!file)return;
 if(file.size>32*1024*1024)return toast('JSON 文件过大，单次最大 32 MB');
 try{importSessions(JSON.parse(await file.text()))}catch(error){toast('导入失败：'+error.message)}
}
document.addEventListener('click',handleClick);
document.addEventListener('input',handleInput);
document.addEventListener('change',handleChange);
document.addEventListener('submit',event=>{if(event.target.id==='new-form'){event.preventDefault();createFromForm()}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&!$('#modal-root').innerHTML.trim())return;if(event.key==='Escape')closeModal()});
$('#import-file').addEventListener('change',handleImport);
window.addEventListener('storage',event=>{if(event.key===C.STORAGE_KEY){db=C.read();for(const s of db.sessions)R.recoverRecording(s);syncErgControl();render();toast('其他标签页已更新数据；如需在此记录，请点击继续')}});
window.addEventListener('pagehide',()=>{D.slots.trainer.erg?.setDesired('stopped');const s=active();if(s?.execution.status==='running'){s.execution.elapsedMs=elapsedNow(s.execution);s.execution.startedAt=null;s.execution.status='paused';R.stopRecording(s);persist(s)}});
D.subscribe(handleDeviceChange);
setInterval(()=>{updateExecution();paintLive();captureActivity();paintDevices()},250);
render();
})();

</script>
</body>
